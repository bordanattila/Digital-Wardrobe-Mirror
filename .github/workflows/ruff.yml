name: Ruff

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.8"
          src: "./backend"
          args: "check"

      - name: Format
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.8"
          src: "./backend"
          args: "format --check"
